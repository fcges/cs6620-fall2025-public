name: Build, Push Docker image and Deploy to EC2 via SSM

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest

      - name: Set image output
        id: image
        run: echo "image=$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to EC2 via SSM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send deploy command via SSM
        id: ssm
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.repository }}:${{ github.sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          echo "Preparing to deploy $IMAGE to $INSTANCE_ID via SSM"
          # Send the SSM Run Command to pull, stop, remove, and run the container
          RESPONSE=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions via SSM" \
            --parameters commands='["docker pull '"$IMAGE"'", "docker stop app || true", "docker rm app || true", "docker run -d --name app -p 80:5000 --restart unless-stopped '"$IMAGE"'"]' \
            --output json)
          echo "$RESPONSE"
          # Extract CommandId for optional verification
          COMMAND_ID=$(echo "$RESPONSE" | jq -r '.Command.CommandId')
          echo "command-id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Verify SSM command submission
        run: |
          echo "SSM Command ID: ${{ steps.ssm.outputs.command-id }}"
          aws ssm list-command-invocations --command-id "${{ steps.ssm.outputs.command-id }}" --details || true
